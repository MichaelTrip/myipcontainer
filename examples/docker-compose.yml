version: '3.8'

services:
  myipcontainer2:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: myipcontainer
    network_mode: host
    environment:
      - PORT=8080
      - HOST="::"                # IPv4 + IPv6 dual-stack (use 0.0.0.0 for IPv4 only)
      - DEBUG=false
      - TRUST_PROXY=false
      - ENABLE_GEOLOCATION=true  # Set to true if behind reverse proxy
      - LOG_VISITORS=true        # Set to false to disable visitor logging
      - APP_VERSION=v1.0.0-dev   # Override version for development
      - BUILD_DATE=2025-10-14
      - GIT_COMMIT=local-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
