version: '3.8'

services:
  myipcontainer2:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: myipcontainer
    network_mode: host
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DEBUG=false
      - TRUST_PROXY=false
      - ENABLE_GEOLOCATION=true  # Set to true if behind reverse proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
