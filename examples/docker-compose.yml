version: '3.8'

services:
  myipcontainer:
    image: ghcr.io/michaeltrip/myipcontainer:latest
    container_name: myipcontainer
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ipcontainer-network

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - myipcontainer
    restart: unless-stopped
    networks:
      - ipcontainer-network

networks:
  ipcontainer-network:
    driver: bridge