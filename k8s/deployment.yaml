apiVersion: apps/v1
kind: Deployment
metadata:
  name: myipcontainer
  labels:
    app: myipcontainer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myipcontainer
  template:
    metadata:
      labels:
        app: myipcontainer
    spec:
      containers:
      - name: myipcontainer
        image: ghcr.io/michaeltrip/myipcontainer:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: HOST
          value: "0.0.0.0"
        - name: DEBUG
          value: "false"
        - name: TRUST_PROXY
          value: "true"  # Enable for Kubernetes ingress
        - name: ENABLE_GEOLOCATION
          value: "true"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5