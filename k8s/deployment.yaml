apiVersion: apps/v1
kind: Deployment
metadata:
  name: myipcontainer
  labels:
    app: myipcontainer
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myipcontainer
  template:
    metadata:
      labels:
        app: myipcontainer
    spec:
      containers:
      - name: myipcontainer
        image: ghcr.io/michaeltrip/myipcontainer:latest
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5